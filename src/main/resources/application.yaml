spring:
  application:
    name: rideflow-backend

#  database
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rideflow}
    username: ${DB_USERNAME:rideflow}
    password: ${DB_PASSWORD:rideflow}

# jpa
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

# flyway

  flyway:
    enabled: true
    locations: classpath:db/migration

# redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# server
server:
  port: ${SERVER_PORT:8080}

# actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# front end API

rideflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

#  cookie
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Strict}

#  otp
  otp:
    length: 6
    ttl-seconds: 300
    max-attempts: 5
    resend-cooldown-seconds: 45
    rate-limit-max-requests: 5
    rate-limit-window-seconds: 3600
    expose-code-in-response: ${OTP_EXPOSE_CODE:false}
  mfa:
    challenge-ttl-seconds: 300

#  seat lock
  seat-lock:
    ttl-seconds: 300
    max-seats-per-lock: 6

# JWT_SECRET must be set explicitly (min 32 bytes) - no default here on
# purpose, so a misconfigured non-local environment fails to start rather
# than silently running with a guessable key. See application-local.yml
# for the local-only development default.
JWT_SECRET: ${JWT_SECRET:}
JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:900}
JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:2592000}

# logging with Slf4j
logging:
  pattern:
    level: "%5p [%X{correlationId}]"
